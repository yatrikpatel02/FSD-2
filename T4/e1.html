<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/data">

        Username: <input type="text" name="uname" placeholder="Enter Your Username" /><br />
        Password: <input type="password" name="pass" placeholder="Enter password" /><br />
        email: <input type="email" name="email" placeholder="Enter email" /><br />
        <label>Gender</label>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female<br />
        <select name="city">
            <option value="Ahmedabad">Ahmedabad</option>
            <option value="Surat">Surat</option>
            <option value="Vadodara">Vadodara</option>
        </select>
        <br />
        Message: <textarea name="msg" rows="10" cols="10"></textarea>
        <button type="submit">submit</button>
    </form>
</body>

</html>
